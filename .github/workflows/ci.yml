name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Forbidden APIs and outside URLs
        run: node scripts/check.mjs
      - name: Translation catalog is up to date
        run: node scripts/strings.mjs --check
      - name: Unit tests
        run: node --test tests/
      - name: Type check
        run: |
          npx --yes typescript@5.9.3 -p tsconfig.json
          npx --yes typescript@5.9.3 -p tsconfig.panel.json
