<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HomeNodes dev harness</title>
<style>
html, body { margin: 0; height: 100%; }
body.light { --primary-background-color: #fafafa; --card-background-color: #fff; --primary-text-color: #212121; --secondary-text-color: #727272; --divider-color: rgba(0,0,0,.12); --primary-color: #03a9f4; }
body.dark { --primary-background-color: #111111; --card-background-color: #1c1c1c; --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --divider-color: rgba(225,225,225,.12); --primary-color: #03a9f4; }
#ctl { position: fixed; bottom: 12px; right: 12px; z-index: 9; font: 12px sans-serif; background: #000a; color: #fff; padding: 6px 8px; border-radius: 6px; display: flex; gap: 6px; align-items: center; }
</style></head>
<body class="dark">
<script>if (new URLSearchParams(location.search).has("bench")) document.write('<img src="/__hold" alt="" hidden>');</script>
<div id="ctl"><button id="dark">Theme</button><button id="play">Replay activity</button><span id="status"></span></div>
<script type="module">
// Runs the panel outside Home Assistant: a fake hass object over the made-up house in fake-house.js.
// Query parameters: ?theme=light ?select=<id> ?open=health|upnext|history|heat ?copies=<n>
//   ?center=<id>&zoom=<k> ?wrap (a height-less container, like HA's) ?nologbook ?shot (hide these controls)
//   ?tz=<IANA zone> (Home Assistant's) ?timeformat=24|am_pm|language|system ?showtime=server|local ?noblueprints
//   The integration's options: ?controls=0 ?grouping=area|label|category|tag ?heatdays=<n> ?hide=<label id>,…
//   ?hostile (names that try to be markup, script and more) ?check (click through and report; see browser-check.mjs)
//   ?bench (time loading, repaints and panning; see browser-bench.mjs)
import { HOSTILE, makeHostile, makeHouse } from "./fake-house.js";
window.__errors = [];
addEventListener("error", (e) => window.__errors.push(String(e.message)));
addEventListener("unhandledrejection", (e) => window.__errors.push(String(e.reason?.message || e.reason)));
await import(`../custom_components/homenodes/frontend/homenodes-panel.js?t=${Date.now()}`);

const q = new URLSearchParams(location.search);
const now = Date.now();
const plainHouse = makeHouse({ now, copies: Number(q.get("copies") || 1) });
const house = q.has("hostile") ? makeHostile(plainHouse) : plainHouse;
let states = Object.fromEntries(house.states.map((s) => [s.entity_id, s]));
const subs = {};
const inRange = (m, t) => t >= Date.parse(m.start_time) / 1000 && t <= Date.parse(m.end_time) / 1000;
const userData = {};
const conn = {
  async sendMessagePromise(m) {
    switch (m.type) {
      case "config/entity_registry/list": return house.entities;
      case "config/device_registry/list": return house.devices;
      case "config/area_registry/list": return house.areas;
      case "config/label_registry/list": return house.labels;
      case "config/category_registry/list": return house.categories[m.scope] || [];
      case "blueprint/substitute": {
        if (q.has("noblueprints")) throw { code: "unknown_command", message: "Unknown command." };
        const hit = house.blueprintSubstitutions[JSON.stringify([m.domain, m.path, m.input])];
        if (!hit) throw { code: "unknown_error", message: `Failed to load blueprint: Unable to find ${m.path}` };
        return { substituted_config: hit };
      }
      case "automation/config": { const c = house.configs[m.entity_id]; if (!c || c.error) throw { code: "not_found", message: "Entity not found" }; return { config: c }; }
      case "script/config": return { config: house.scriptConfigs[m.entity_id] };
      case "frontend/get_user_data": return { value: userData[m.key] ?? null };
      case "frontend/set_user_data": userData[m.key] = m.value; return null;
      case "trace/list": return house.traces[`${m.domain}:${m.item_id}`]?.list || [];
      case "trace/get": return house.traces[`${m.domain}:${m.item_id}`]?.runs?.[m.run_id];
      case "history/history_during_period": {
        const out = {};
        for (const id of m.entity_ids) { const rows = house.history[id]; if (rows) out[id] = rows.filter((r, i) => i === 0 || inRange(m, r.lu)); }
        return out;
      }
      case "logbook/get_events": {
        if (q.has("nologbook")) throw { code: "unknown_command", message: "Unknown command." };
        const ids = new Set(m.entity_ids);
        return house.logbook.filter((e) => ids.has(e.entity_id) && inRange(m, Number(e.when)));
      }
    }
    throw new Error(`The harness doesn't fake ${m.type}`);
  },
  async subscribeEvents(cb, type) { (subs[type] ||= []).push(cb); return () => { subs[type] = subs[type].filter((x) => x !== cb); }; },
  async subscribeMessage(cb, msg) {
    if (msg.type === "render_template") setTimeout(() => cb(house.templates[msg.template] || { error: "not in the fake house" }), 30);
    return () => {};
  },
};
let dark = q.get("theme") !== "light";
document.body.className = dark ? "dark" : "light";
const el = document.createElement("homenodes-panel");
const fire = (ev) => {
  if (ev.event_type === "state_changed" && ev.data.new_state) { states = { ...states, [ev.data.entity_id]: ev.data.new_state }; el.hass = mk(); }
  for (const cb of subs[ev.event_type] || []) cb(ev);
};
// Service calls change the fake states, so control from the map can be seen working.
const callService = async (domain, service, data) => {
  const id = data.entity_id, old = states[id];
  if (!old) return;
  const ctx = { id: `call${Date.now()}`, parent_id: null, user_id: "me" };
  let next = old.state;
  if (service === "toggle") next = old.state === "on" ? "off" : "on";
  if (service === "turn_on") next = "on";
  if (service === "turn_off") next = "off";
  if (domain === "automation" && service === "trigger") { fire({ event_type: "automation_triggered", data: { entity_id: id, source: "action" }, context: ctx }); next = old.state; }
  fire({ event_type: "state_changed", data: { entity_id: id, old_state: old, new_state: { ...old, state: next, last_changed: new Date().toISOString(), context: ctx } }, context: ctx });
};
// The editor's REST API only knows automations stored in automations.yaml, as in Home Assistant.
const callApi = async (method, path) => {
  const [, domain, id] = path.match(/^config\/(automation|script)\/config\/(.+)$/) || [];
  const key = decodeURIComponent(id || "");
  const known = domain === "automation" ? Object.values(house.configs).some((c) => c.id === key) && !house.yamlDefined.includes(key) : !!house.scriptConfigs[`script.${key}`];
  if (method !== "GET" || !known) throw { status_code: 404, body: { message: "Resource not found" } };
  return {};
};
const locale = { language: "en", time_format: q.get("timeformat") || "language", time_zone: q.get("showtime") || "local" };
const config = { time_zone: q.get("tz") || Intl.DateTimeFormat().resolvedOptions().timeZone };
const mk = () => ({ states, connection: conn, themes: { darkMode: dark }, language: "en", locale, config, user: { is_admin: true }, callService, callApi });
// Without any of these the panel gets no config, as when it is added by hand with panel_custom.
const opt = ["controls", "grouping", "heatdays", "hide"].some((k) => q.has(k));
if (opt) el.panel = { config: {
  controls: q.get("controls") !== "0", default_grouping: q.get("grouping") || "area", heat_days: Number(q.get("heatdays") || 7),
  hidden_labels: q.get("hide") ? q.get("hide").split(",") : [], _panel_custom: { name: "homenodes-panel" },
} };
const loadStart = performance.now();
el.hass = mk();
el.narrow = innerWidth < 870;
(q.has("wrap") ? document.body.appendChild(document.createElement("div")) : document.body).append(el);
window.__panel = el;
window.__fire = fire;
window.__house = house;
if (q.has("shot")) document.getElementById("ctl").style.display = "none";
document.getElementById("dark").onclick = () => { dark = !dark; document.body.className = dark ? "dark" : "light"; el.hass = mk(); };
document.getElementById("play").onclick = async () => {
  const st = document.getElementById("status");
  for (let i = 0; i < house.events.length; i++) {
    await new Promise((r) => setTimeout(r, i ? Math.min(1500, house.events[i].t - house.events[i - 1].t) : 0));
    fire(house.events[i].event);
    st.textContent = `${i + 1}/${house.events.length}`;
  }
};
(async () => {
  while (!el._ready) await new Promise((r) => setTimeout(r, 5));
  const loaded = performance.now() - loadStart;
  if (q.has("select")) el._select(q.get("select"), false, null, true);
  if (q.has("center")) {
    const n = el._nodes.get(q.get("center")), r = el._svg.getBoundingClientRect(), k = Number(q.get("zoom") || 1);
    el._view = { k, x: r.width / 2 - (n.x + n.w / 2) * k, y: r.height / 2 - (n.y + n.h / 2) * k };
    el._applyView();
  }
  if (q.get("open") === "health") el._showHealth();
  if (q.get("open") === "upnext") el._showUpNext();
  if (q.get("open") === "history") el._enterHistory();
  if (q.get("open") === "heat") el._setOpt("heat", true);
  if (q.has("check")) await check();
  if (q.has("bench")) await bench(loaded);
  document.body.dataset.ready = "1";
})();

// Script time for the things that happen often, in ms: best of several, so noise only adds.
async function bench(loaded) {
  const best = (fn, n = 5) => { let b = Infinity; for (let i = 0; i < n; i++) { const t = performance.now(); fn(); b = Math.min(b, performance.now() - t); } return b; };
  const light = Object.keys(states).find((id) => id.startsWith("light."));
  let flip = 0;
  const r = {
    load: loaded,
    elements: el.shadowRoot.querySelectorAll("*").length,
    // A state change as Home Assistant delivers it, then the condition pass it schedules.
    stateChange: best(() => { states = { ...states, [light]: { ...states[light], state: flip++ % 2 ? "on" : "off" } }; el.hass = mk(); el._syncStates(); el._evalAll(); }),
    // Panning to each corner and back: culling, and catching up on what was off screen.
    sweep: best(() => { const v = el._view; for (const [dx, dy] of [[-3000, 0], [0, -3000], [3000, 3000], [0, 0]]) { el._view = { ...v, x: v.x + dx, y: v.y + dy }; el._applyView(); el._cull(); } el._view = v; el._applyView(); el._cull(); el._svg.getBoundingClientRect(); }, 3),
    clockTick: best(() => el._tickClock()),
    pan: best(() => { for (let i = 0; i < 20; i++) { el._view = { ...el._view, x: el._view.x + 7 }; el._applyView(); el._svg.getBoundingClientRect(); } }, 3) / 20,
    zoomOut: best(() => { el._view = { ...el._view, k: 0.3 }; el._applyView(); getComputedStyle(el._svg).opacity; el._view = { ...el._view, k: 1 }; el._applyView(); getComputedStyle(el._svg).opacity; }, 3),
    select: best(() => { el._select("automation.kitchen_motion_lights", false, null, true); el._select(null, false, null, true); }, 3),
  };
  const out = document.createElement("pre");
  out.id = "bench";
  out.textContent = JSON.stringify(r);
  document.body.append(out);
  await fetch("/__release");
}

// Visits every automation and script, some entities, Health and Up next, and each grouping, then
// reports anything that isn't one of the panel's own elements, any on* attribute, and any error.
async function check() {
  const OURS = new Set("span div button li ul p h1 h2 h3 h4 hr b summary small select pre option input details time style label dt dl dd canvas aside svg circle defs g path pattern rect text title use symbol line".split(" "));
  const problems = [], seen = new Set();
  let text = "";
  const settle = () => new Promise((r) => setTimeout(r, 80));
  const scan = (where) => {
    for (const e of el.shadowRoot.querySelectorAll("*")) {
      const tag = e.localName;
      if (!OURS.has(tag) && !seen.has(`${where}:${tag}`)) { seen.add(`${where}:${tag}`); problems.push(`${where}: unexpected <${tag}>`); }
      for (const a of e.attributes) {
        if (/^on/i.test(a.name)) problems.push(`${where}: <${tag} ${a.name}>`);
        if (/^\s*javascript:/i.test(a.value) && /href$/i.test(a.name)) problems.push(`${where}: <${tag} ${a.name}=javascript:>`);
      }
    }
    text += el.shadowRoot.textContent;
  };
  const visit = async (where, act) => { act(); await settle(); scan(where); };
  const nodes = [...el._nodes.values()];
  for (const n of nodes.filter((n) => n.kind === "automation" || n.kind === "script")) await visit(n.id, () => el._select(n.id, false, null, true));
  for (const n of nodes.filter((n) => n.kind === "entity").slice(0, 12)) await visit(n.id, () => el._select(n.id, false, null, true));
  await visit("overview", () => el._select(null, false, null, true));
  await visit("health", () => el._showHealth());
  await visit("up next", () => el._showUpNext());
  el._select(null, false, null, true);
  for (const g of ["label", "category", "tag", "area"]) { await el._setGrouping(g); await settle(); scan(`group by ${g}`); }
  // Shown as text means its markup survives, verbatim, somewhere in the panel's text.
  const clean = (t) => t.replace(/[\u0000-\u001f\u200b\u202a-\u202e]/g, "");
  const shown = clean(text);
  if (q.has("hostile")) for (const name of HOSTILE) {
    const probe = clean(name).slice(0, 24);
    if (!shown.includes(probe)) problems.push(`never shown as text: ${JSON.stringify(probe)}`);
  }
  if (window.__pwned) problems.push("hostile script ran");
  for (const e of window.__errors) problems.push(`error: ${e}`);
  const out = document.createElement("pre");
  out.id = "check";
  out.textContent = JSON.stringify({ hostile: q.has("hostile"), problems: [...new Set(problems)], nodes: nodes.length });
  document.body.append(out);
}
</script></body></html>
