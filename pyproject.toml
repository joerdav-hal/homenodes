# Python tooling for the integration. The frontend's tooling is in package.json.

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/integration"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PL", "D"]
ignore = ["D203", "D213", "D401", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.homenodes"]
force-sort-within-sections = true
combine-as-imports = true
